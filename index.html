function nextId(table){return Math.max(0,...(STORE[table]||[]).map(x=>Number(x.id)||0))+1}
function overlap(a,b){return new Date(a.start)<new Date(b.end)&&new Date(a.end)>new Date(b.start)}
function mutate(m){let t=m.table,arr=STORE[t]||[],r=arr.find(x=>x.id==m.id),p=STORE.projects.find(x=>x.id==m.project_id);
 if(m.op==='save'){if(!STORE[t])STORE[t]=[];arr=STORE[t];let v={...m.values};if(t==='projects'){if(new Date(v.end)<=new Date(v.start))throw Error('Bitiş başlangıçtan sonra olmalıdır.');if(!v.customer_id)throw Error('Müşteri seçiniz.')}if(r)Object.assign(r,v,{version:(r.version||0)+1});else arr.push({id:nextId(t),version:1,archived:0,...v,...(t==='projects'?{status:'Taslak'}:{})});}
 else if(m.op==='archive'){if(!r)throw Error('Kayıt bulunamadı');r.archived=m.restore?0:1;}
 else if(m.op==='status'){if(!p)throw Error('Proje bulunamadı');p.status=m.status;}
 else if(m.op==='assign'){if(!p)throw Error('Proje bulunamadı');let isVehicle=m.type==='vehicles'||m.type==='vehicle',tt=isVehicle?'vehicle_assignments':'assignments',key=isVehicle?'vehicle_id':'crew_id',id=Number(m.resource_id);if(!id)throw Error('Kaynak seçiniz');let conflict=STORE[tt].find(a=>a[key]===id && a.project_id!==p.id && !STORE.projects.find(q=>q.id===a.project_id)?.archived && overlap(STORE.projects.find(q=>q.id===a.project_id),p));if(conflict)throw Error('Kaynak başka bir projede aynı tarihte atanmış.');if(!STORE[tt].some(a=>a[key]===id&&a.project_id===p.id))STORE[tt].push({id:nextId(tt),project_id:p.id,[key]:id});}
 else if(m.op==='unassign'){let tt=(m.type==='vehicles'||m.type==='vehicle')?'vehicle_assignments':'assignments';STORE[tt]=STORE[tt].filter(x=>x.id!=m.id);}
 else if(m.op==='line'){let e=STORE.equipment.find(x=>x.id==Number(m.equipment_id));if(!e)throw Error('Ekipman seçiniz');let qty=Number(m.qty);if(!Number.isInteger(qty)||qty<=0)throw Error('Adet geçersiz');let used=STORE.project_lines.filter(l=>l.equipment_id===e.id&&l.project_id!==m.project_id&&STORE.projects.some(p2=>p2.id===l.project_id&&p&&!p2.archived&&overlap(p2,p))).reduce((a,l)=>a+Number(l.qty),0);if(qty+used>Number(e.quantity))throw Error('Ekipman çakışması: mevcut stok yetersiz');STORE.project_lines.push({id:nextId('project_lines'),project_id:p.id,equipment_id:e.id,qty,price:Number(e.price)||0,packed:0,dispatched:0,returned:0});}
 else if(m.op==='remove-line'){STORE.project_lines=STORE.project_lines.filter(l=>l.id!=m.id);}
 else if(m.op==='move'){let l=STORE.project_lines.find(x=>x.id==m.line_id),n=Number(m.qty);if(!l||!Number.isInteger(n)||n<=0)throw Error('Geçersiz ekipman hareketi');if(m.action==='pack'){if(n>l.qty-l.packed)throw Error('Paketleme miktarı aşıldı');l.packed+=n}else if(m.action==='dispatch'){if(n>l.packed-l.dispatched)throw Error('Paketlenenden fazla sevk edilemez');l.dispatched+=n}else if(m.action==='return'){if(n>l.dispatched-l.returned)throw Error('Sevk edilenden fazla iade edilemez');l.returned+=n}else throw Error('Bilinmeyen hareket');STORE.movements.push({id:nextId('movements'),project_id:p.id,line_id:l.id,action:m.action,qty:n,created_at:new Date().toISOString()});}
 else if(m.op==='invoice'){let net=STORE.project_lines.filter(l=>l.project_id===p.id).reduce((a,l)=>a+l.qty*l.price,0),tax=Number(m.tax)||0;STORE.invoices.push({id:nextId('invoices'),project_id:p.id,number:String(nextId('invoices')),net,tax,total:net*(1+tax/100),status:'Ödenmedi',created_at:Date.now(),version:1});}

}

function input(f,value){let[k,n,type='text',ref]=f,required=['name','code','start','end','quantity','price'].includes(k);if(k==='customer_id'&&type==='ref'){return `<label class="wide">Müşteri<select name="customer_id" onchange="customerInline(this)"><option value="">Müşteri seçiniz</option>${D.contacts.filter(x=>!x.archived).map(x=>`<option value="${x.id}" ${x.id==value?'selected':''}>${esc(x.name)}</option>`).join('')}<option value="__new__">＋ Yeni müşteri oluştur</option></select></label><div id="inline-customer" class="wide" hidden style="padding:14px;background:#eef5ff;border:1px solid #d0e0f5;border-radius:10px"><b>Yeni müşteri bilgileri</b><div class="fields" style="margin-top:12px"><label>Müşteri / şirket adı<input name="new_customer_name"></label><label>Telefon<input name="new_customer_phone"></label><label>E-posta<input type="email" name="new_customer_email"></label><label>Adres<input name="new_customer_address"></label></div></div>`}let control=type==='select'?`<select name="${k}">${ref.split(',').map(v=>`<option ${v===value?'selected':''}>${esc(v)}</option>`).join('')}</select>`:type==='ref'?`<select name="${k}"><option value="">Seçiniz</option>${(D[ref]||[]).filter(x=>!x.archived).map(x=>`<option value="${x.id}" ${x.id==value?'selected':''}>${esc(x.name)}</option>`).join('')}</select>`:type==='textarea'?`<textarea name="${k}">${esc(value)}</textarea>`:`<input name="${k}" type="${type}" value="${esc(value)}" ${required?'required':''} ${type==='number'?'min="0" step="'+(k==='price'?'0.01':'1')+'"':''}>`;return `<label ${type==='textarea'?'class="wide"':''}>${n}${control}</label>`}
function edit(t,id){let r=lookup(t,id)||{},fs=config[t]||[['name','Başlık'],['status','Durum','select','Yapılacak,Devam ediyor,Tamamlandı'],['date','Tarih','date'],['project_id','Proje','ref','projects'],['notes','Açıklama','textarea']];show(id?'Kaydı düzenle':'Yeni kayıt',`<form id="editform"><div class="fields">${fs.map(f=>input(f,r[f[0]]??(f[2]==='number'?0:''))).join('')}</div><footer><button type="button" onclick="$('#dialog').close()">Vazgeç</button><button class="primary">Kaydet</button></footer></form>`);$('#editform').onsubmit=async e=>{e.preventDefault();let values=Object.fromEntries(new FormData(e.target));if(t==='projects'&&values.customer_id==='__new__'){if(!values.new_customer_name?.trim()){toast('Yeni müşteri adı gerekli');return}let customer={name:values.new_customer_name.trim(),phone:values.new_customer_phone||'',email:values.new_customer_email||'',address:values.new_customer_address||'',kind:'Müşteri'};await api('mutate',{op:'save',table:'contacts',values:customer});values.customer_id=STORE.contacts.at(-1).id;}Object.keys(values).filter(k=>k.startsWith('new_customer_')).forEach(k=>delete values[k]);for(let f of fs)if(f[2]==='ref')values[f[0]]=values[f[0]]?Number(values[f[0]]):null;if(t==='records')values.module=r.module||route;if(await run({op:'save',table:t,id,version:r.version,values}))$('#dialog').close()}}
function planner(){let ps=D.projects.filter(p=>!p.archived);let resources=MASTER_PLAN==='all'?['projects','crew','vehicles']: [MASTER_PLAN];let buttons=[['all','Tümü'],['projects','Projeler'],['crew','Personel'],['vehicles','Araçlar']].map(([k,n])=>`<button class="${MASTER_PLAN===k?'active':''}" onclick="MASTER_PLAN='${k}';renderBody()">${n}</button>`).join('');let lines=[];if(resources.includes('projects'))ps.forEach(p=>lines.push(`<div class="resource-row"><span>📁 ${esc(p.name)}</span><small>${dt(p.start)} — ${dt(p.end)}</small><button onclick="openProject(${p.id})">Aç</button></div>`));if(resources.includes('crew'))D.crew.filter(c=>!c.archived).forEach(c=>{let a=D.assignments.filter(a=>a.crew_id===c.id),n=a.map(x=>label('projects',x.project_id)).join(', ')||'Atama yok';lines.push(`<div class="resource-row"><span>👤 ${esc(c.name)}</span><small>${esc(n)}</small><button onclick="go('crew')">Personel</button></div>`)});if(resources.includes('vehicles'))D.vehicles.filter(v=>!v.archived).forEach(v=>{let a=D.vehicle_assignments.filter(a=>a.vehicle_id===v.id),n=a.map(x=>label('projects',x.project_id)).join(', ')||'Atama yok';lines.push(`<div class="resource-row"><span>🚚 ${esc(v.name)}</span><small>${esc(v.plate||'')} · ${esc(n)}</small><button onclick="go('vehicles')">Araç</button></div>`)});return heading('Ekip planlayıcısı',B('Yeni personel','plus',"edit('crew')")+B('Yeni araç','plus',"edit('vehicles')")+B('Yeni proje','plus',"edit('projects')",'primary'),'Personel · Araç · Proje · Takvim')+`<div class="resource-tabs">${buttons}</div>${timeline(ps,true)}<div class="card" style="margin-top:18px"><h2>Kaynak ve atama listesi</h2><div class="resource-rows">${lines.join('')||'<p>Henüz kaynak yok.</p>'}</div></div>`}
