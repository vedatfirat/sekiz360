ass="help">Ekipman kalemi: <b>'+aa.length+'</b><br>Personel: <b>'+ass.length+'</b><br>Araç: <b>'+state.vehicleAssignments.filter(a=>a.projectId===p.id).length+'</b><br>Açık görev: <b>'+tt.filter(t=>!t.done).length+'</b><br>Paketlenmiş miktar: <b>'+aa.reduce((s,a)=>s+a.packed,0)+'</b><br>Sevk edilen miktar: <b>'+aa.reduce((s,a)=>s+a.out-a.returned,0)+'</b></p></div></div>')}

function calendar(){let base=new Date();base.setDate(base.getDate()+calShift*14);let days=Array.from({length:14},(_,i)=>{let d=new Date(base);d.setDate(base.getDate()+i);return iso(d)});return '<div class="card"><div class="section-head"><h2>14 Günlük Proje Takvimi</h2><div class="actions"><button class="btn mini" data-act="cal-prev">← Önceki</button><button class="btn mini" data-act="cal-now">Bugün</button><button class="btn mini" data-act="cal-next">Sonraki →</button></div></div><div class="calendar">'+days.map(d=>{let pp=state.projects.filter(p=>active(p)&&p.start<=d&&p.end>=d);return '<div class="day '+(d===offset(0)?'today':'')+'"><div class="dayhead">'+new Date(d+'T12:00:00').toLocaleDateString('tr-TR',{weekday:'short',day:'numeric',month:'short'})+'</div>'+pp.map(p=>'<div class="event" data-open="'+p.id+'" title="'+esc(p.name)+'">'+esc(p.name)+'</div>').join('')+'</div>'}).join('')+'</div><p class="small muted mt">Proje üzerine tıklayarak ayrıntılarına ulaşabilirsin.</p></div>'}

function plannerTimeline(){let base=new Date();base.setHours(12,0,0,0);base.setDate(base.getDate()+plannerShift*7);let days=Array.from({length:7},(_,i)=>{let d=new Date(base);d.setDate(base.getDate()+i);return iso(d)});let rows=[];if(['all','projects'].includes(plannerKind))state.projects.filter(active).forEach(p=>rows.push({group:'PROJE',name:p.name,desc:p.client,items:[p]}));if(['all','people'].includes(plannerKind))state.crew.forEach(c=>rows.push({group:'PERSONEL',name:c.name,desc:c.role,items:state.assignments.filter(a=>a.crewId===c.id).map(a=>project(a.projectId)).filter(Boolean)}));if(['all','vehicles'].includes(plannerKind))state.vehicles.forEach(v=>rows.push({group:'ARAÇ',name:v.name,desc:v.plate,items:state.vehicleAssignments.filter(a=>a.vehicleId===v.id).map(a=>project(a.projectId)).filter(Boolean)}));return '<div class="plannerwrap"><div class="planner"><div class="phead">Kaynak / Proje</div>'+days.map(d=>'<div class="phead '+(d===offset(0)?'today':'')+'">'+format(d)+'</div>').join('')+rows.map(r=>'<div class="prowtitle"><span class="tiny muted">'+r.group+'</span><b>'+esc(r.name)+'</b><small>'+esc(r.desc)+'</small></div>'+days.map(d=>{let hits=r.items.filter(p=>p.start<=d&&p.end>=d);return '<div class="pcell '+(d===offset(0)?'today':'')+'">'+hits.slice(0,2).map(p=>'<button title="'+esc(p.name)+'" data-open="'+p.id+'" class="pbar '+(r.group==='ARAÇ'?'veh':r.group==='PERSONEL'?'person':'')+'">'+esc(r.group==='PROJE'?p.name:p.name.slice(0,13))+'</button>').join('')+'</div>'}).join('')).join('')+'</div></div>'}

function contactForm(c){openModal(c?'Müşteri Düzenle':'Yeni Müşteri',[{name:'name',label:'Firma / müşteri adı',required:true},{name:'contact',label:'Yetkili kişi'},{name:'phone',label:'Telefon'},{name:'email',label:'E-posta',type:'email'}],d=>{let name=d.name.trim();if(!name){toast('Müşteri adı gerekli');return false}if(state.contacts.some(x=>x.id!==c?.id&&x.name.toLowerCase()===name.toLowerCase())){toast('Bu müşteri zaten kayıtlı');return false}if(c){let old=c.name;Object.assign(c,d);state.projects.filter(p=>p.client===old).forEach(p=>p.client=name)}else state.contacts.push({id:uid(),...d});log('Müşteri kaydedildi: '+name)},c||{})}
