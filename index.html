function input(f,value){let[k,n,type='text',ref]=f;let required=['name','code','start','end','quantity','price'].includes(k);let control=type==='select'?`<select name="${k}">${ref.split(',').map(v=>`<option ${v===value?'selected':''}>${esc(v)}</option>`).join('')}</select>`:type==='ref'?`<select name="${k}"><option value="">Seçiniz</option>${D[ref].filter(x=>!x.archived).map(x=>`<option value="${x.id}" ${x.id==value?'selected':''}>${esc(x.name)}</option>`).join('')}</select>`:type==='textarea'?`<textarea name="${k}">${esc(value)}</textarea>`:`<input name="${k}" type="${type}" value="${esc(value)}" ${required?'required':''} ${type==='number'?'min="0" step="'+(k==='price'?'0.01':'1')+'"':''}>`;return `<label ${type==='textarea'?'class="wide"':''}>${n}${control}</label>`}

async function archive(t,id){if(confirm(archived?'Kayıt geri alınsın mı?':'Kayıt arşivlensin mi?'))await run({op:'archive',table:t,id,restore:archived})}
function dashboard(){let ps=D.projects.filter(p=>!p.archived), active=ps.filter(p=>!['Tamamlandı','İptal'].includes(p.status));let amounts=D.invoices.reduce((a,x)=>{a[x.status==='Ödendi'?'paid':'due']+=x.total;return a},{paid:0,due:0});let short=D.shortages.filter(x=>x.qty>0);return heading(route==='statistics'?'İstatistikler':'Anasayfa',btn('+ Proje oluştur',"edit('projects')",true),'Canlı çalışma alanı · '+new Date().toLocaleDateString('tr-TR'))+`<div class="cards">${[['Aktif proje',active.length,'projects'],['Ekipman çeşidi',D.equipment.filter(e=>!e.archived).length,'equipment'],['Ekip üyesi',D.crew.filter(e=>!e.archived).length,'crew'],['Stok eksiği olan kalem',short.length,'shortages']].map(([n,v,r])=>`<div class="card"><span class="muted">${n}</span><b class="number">${v}</b><button class="link" onclick="go('${r}')">Listeyi aç →</button></div>`).join('')}</div><div class="split"><section class="card"><h2>Proje durumları</h2>${['Taslak','Onaylandı','Sahada','Tamamlandı','İptal'].map(s=>{let n=ps.filter(p=>p.status===s).length;return `<div>${s}<span style="float:right">${n}</span><div class="bar"><i style="width:${ps.length?n/ps.length*100:0}%"></i></div></div>`}).join('')}</section><section class="card"><h2>Fatura özeti</h2><p class="muted">Ödenmemiş toplam</p><b class="number">${money(amounts.due)}</b><p class="muted">Ödenen toplam</p><b class="number">${money(amounts.paid)}</b>${btn('Faturaları aç',"go('invoices')")}</section></div><section class="card" style="margin-top:20px"><h2>Yaklaşan projeler</h2>${active.length?table(['Proje','Başlangıç','Bitiş','Durum'],active.sort((a,b)=>a.start.localeCompare(b.start)).slice(0,8).map(p=>`<tr><td><button class="link" onclick="openProject(${p.id})">${esc(p.name)}</button></td><td>${dt(p.start)}</td><td>${dt(p.end)}</td><td>${tag(p.status)}</td></tr>`)):empty('İlk projenizi oluşturun.')}</section>`}
function projectDetail(){let p=lookup('projects',selected),ls=D.project_lines.filter(l=>l.project_id===p.id);let sum=ls.reduce((a,l)=>a+l.price*l.qty,0);let actions=btn('← Projeler',"go('projects')")+btn('Düzenle',`edit('projects',${p.id})`);if(p.status==='Taslak')actions+=btn('Projeyi onayla',`run({op:'status',project_id:${p.id},status:'Onaylandı'})`,true);if(p.status==='Onaylandı')actions+=btn('Taslağa al',`run({op:'status',project_id:${p.id},status:'Taslak'})`);if(p.status==='Sahada')actions+=btn('Projeyi tamamla',`run({op:'status',project_id:${p.id},status:'Tamamlandı'})`,true);if(['Taslak','Onaylandı'].includes(p.status))actions+=btn('İptal et',`cancelProject(${p.id})`);let html=heading(p.name,actions,`${label('contacts',p.customer_id)} · ${dt(p.start)} — ${dt(p.end)}`)+`<div class="card" style="margin-bottom:18px"><div class="actions">${tag(p.status)}<span>Proje #${p.id}</span><span style="margin-left:auto">Ekipman toplamı <b>${money(sum)}</b></span></div></div><div class="tabs">${[['equipment','Ekipman'],['crew','Ekip ve araç'],['warehouse','Depo'],['finance','Finans'],['notes','Notlar']].map(([k,n])=>`<button class="${tab===k?'active':''}" onclick="tab='${k}';renderBody()">${n}</button>`).join('')}</div>`;
if(tab==='equipment')html+=`<div class="actions">${p.status==='Taslak'?btn('+ Ekipman ekle',`lineDialog(${p.id})`,true):''}</div><br><div class="panel">`+(ls.length?table(['Ürün','Miktar','Birim fiyat','Toplam','Eksik',''],ls.map(l=>`<tr><td>${esc(label('equipment',l.equipment_id))}</td><td>${l.qty}</td><td>${money(l.price)}</td><td>${money(l.qty*l.price)}</td><td>${D.shortages.find(s=>s.line_id===l.id)?.qty||0}</td><td>${p.status==='Taslak'?btn('Kaldır',`run({op:'remove-line',project_id:${p.id},id:${l.id}})`):''}</td></tr>`)):empty('Projeye ekipman eklenmedi.'))+'</div>';
if(tab==='crew')html+=`<div class="split">${['crew','vehicles'].map(t=>{let arr=D[t==='crew'?'assignments':'vehicle_assignments'].filter(x=>x.project_id===p.id);return `<section class="card"><div class="head"><h2>${t==='crew'?'Ekip atamaları':'Araç atamaları'}</h2>${btn('+ Ata',`assignDialog(${p.id},'${t}')`,true)}${t==='crew'?btn('Toplu ata',`bulkAssignDialog(${p.id})`):''}</div>${arr.map(a=>`<div class="panelbar">${t==='crew'?esc(label(t,a.crew_id)):vehicleDetails(a.vehicle_id)}${btn('Kaldır',`run({op:'unassign',project_id:${p.id},id:${a.id},type:'${t}'})`)}</div>`).join('')||'<p class="muted">Henüz atama yok.</p>'}</section>`}).join('')}</div>`;
if(tab==='warehouse')html+=`<div class="notice">Miktar girişiyle kısmi hazırlık, çıkış ve iade yapabilirsiniz. Her hareket işlem geçmişine kaydedilir.</div><div class="panel">${ls.length?table(['Ürün','Plan','Hazır','Çıkış','İade','İşlem'],ls.map(l=>`<tr><td>${esc(label('equipment',l.equipment_id))}</td><td>${l.qty}</td><td>${l.packed}</td><td>${l.dispatched}</td><td>${l.returned}</td><td><div class="actions">${btn('Hazırla',`moveDialog(${p.id},${l.id},'pack')`)}${btn('Çıkış',`moveDialog(${p.id},${l.id},'dispatch')`)}${btn('İade',`moveDialog(${p.id},${l.id},'return')`)}</div></td></tr>`)):empty()}</div>`;
if(tab==='finance')html+=`<div class="card"><h2>Fatura kaydı</h2><p>Ekipman kalemleri üzerinden ${money(sum)} net tutar.</p><p class="muted">Bu sürümde süre çarpanı ve hizmet maliyeti hesaplanmaz. Oluşan kayıt e-fatura değildir.</p>${D.invoices.some(i=>i.project_id===p.id)?btn('Faturayı aç',"go('invoices')"):btn('Fatura oluştur',`invoiceDialog(${p.id})`,true)}</div>`;
if(tab==='notes')html+=`<div class="card"><h2>Proje notu</h2><p style="white-space:pre-wrap">${esc(p.notes||'Not eklenmedi.')}</p>${btn('Notu düzenle',`edit('projects',${p.id})`)}</div>`;return html}
function lineDialog(pid){show('Ekipman planına ekle',`<form id="lineform"><div class="fields">${input(['equipment_id','Ekipman','ref','equipment'],'')}${input(['qty','Miktar','number'],1)}</div><p class="subtle">Aynı ürünü tekrar seçmek plan miktarını günceller.</p><footer><button class="primary">Kaydet</button></footer></form>`);$('#lineform').onsubmit=async e=>{e.preventDefault();let v=Object.fromEntries(new FormData(e.target));if(await run({op:'line',project_id:pid,...v}))$('#dialog').close()}}

// V3.1 — Toplu atama penceresi, tekli atama aynen korunur.
let BULK_PROJECT_ID=null,BULK_SELECTED=new Set(),BULK_QUERY='',BULK_ROLE='all';
function bulkEligibility(pid,crewId){
 const p=lookup('projects',Number(pid)),c=lookup('crew',Number(crewId));
 if(!p||p.archived||p.status==='İptal'||!c||c.archived)return {kind:'invalid',label:'Uygun değil'};
 if((D.assignments||[]).some(a=>a.project_id===p.id&&a.crew_id===c.id))return {kind:'assigned',label:'Zaten atanmış'};
 const conflict=(D.assignments||[]).find(a=>{if(a.crew_id!==c.id||a.project_id===p.id)return false;let q=lookup('projects',a.project_id);return q&&!q.archived&&q.status!=='İptal'&&overlap(p,q)});
 if(conflict)return {kind:'conflict',label:'Tarih çakışması',other:label('projects',conflict.project_id)};
 return {kind:'ok',label:'Uygun'};
}
function bulkAssignDialog(pid){
 const projects=(D.projects||[]).filter(p=>!p.archived&&p.status!=='İptal');
 if(!projects.length){toast('Önce aktif bir proje oluşturunuz.');return}
 const selectedProject=projects.find(p=>p.id===Number(pid))||projects[0];
 BULK_PROJECT_ID=selectedProject.id; BULK_SELECTED=new Set(); BULK_QUERY=''; BULK_ROLE='all';
 show('Toplu personel atama',`<form id="bulk-assign-form"><div class="bulk-help">Bir projeye birden fazla ekip üyesini tek işlemde atayın. İşlem, seçili projenin <b>başlangıç ve bitiş tarihlerini</b> kapsar; çakışan personel eklenmez.</div><div class="bulk-top"><label>Atanacak proje<select id="bulk-project" onchange="bulkProjectChange(this.value)">${projects.map(p=>`<option value="${p.id}" ${p.id===BULK_PROJECT_ID?'selected':''}>${esc(p.name)}</option>`).join('')}</select></label><label>Personel ara<input id="bulk-search" placeholder="İsim veya görev ara" oninput="BULK_QUERY=this.value;bulkRenderList()"></label><label>Görev / departman<select id="bulk-role" onchange="BULK_ROLE=this.value;bulkRenderList()"><option value="all">Tüm görevler</option>${[...new Set(D.crew.filter(c=>!c.archived).map(c=>(c.role||'Görev belirtilmemiş').trim()))].sort((a,b)=>a.localeCompare(b,'tr')).map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('')}</select></label><label>Proje tarihleri<div id="bulk-dates" style="padding:12px;background:#f6f9fd;border:1px solid #dbe4f0;border-radius:8px;margin-top:7px;font-size:13px;font-weight:550"></div></label></div><div class="bulk-controls"><button type="button" onclick="bulkSelectVisible()">✓ Görünen uygun kişileri seç</button><button type="button" onclick="bulkClearSelection()">Seçimi temizle</button><span id="bulk-count" class="bulk-count">0 seçili</span></div><div id="bulk-list" class="bulk-crew-list"></div><div id="bulk-summary" class="bulk-summary"></div><div class="bulk-note">Sarı: tarihler çakışıyor · Gri: projede zaten atanmış. Uygun olmayan kişiler seçilemez.</div><div class="bulk-footer"><button type="button" onclick="document.getElementById('dialog').close()">Vazgeç</button><button class="primary" id="bulk-submit" type="submit" disabled>Seçilen personeli ata</button></div></form>`);
 $('#bulk-assign-form').onsubmit=bulkAssignSubmit;
 bulkRenderList();
}
function bulkProjectChange(value){BULK_PROJECT_ID=Number(value);BULK_SELECTED=new Set();bulkRenderList()}
function bulkVisibleCrew(){let q=BULK_QUERY.trim().toLocaleLowerCase('tr-TR');return (D.crew||[]).filter(c=>!c.archived&&(BULK_ROLE==='all'||(c.role||'Görev belirtilmemiş').trim()===BULK_ROLE)&&(!q||(c.name+' '+(c.role||'')).toLocaleLowerCase('tr-TR').includes(q))).sort((a,b)=>a.name.localeCompare(b.name,'tr'))}
function bulkRenderList(){
 const target=$('#bulk-list');if(!target)return;
 let p=lookup('projects',BULK_PROJECT_ID);$('#bulk-dates').textContent=p?`${dt(p.start)} — ${dt(p.end)}`:'Proje seçiniz';
 const shown=bulkVisibleCrew();let available=0,conflict=0,assigned=0;
 target.innerHTML=shown.map(c=>{let st=bulkEligibility(BULK_PROJECT_ID,c.id),ok=st.kind==='ok';if(ok)available++;else if(st.kind==='assigned')assigned++;else conflict++;
 if(!ok)BULK_SELECTED.delete(c.id);
 return `<label class="bulk-member"><input type="checkbox" value="${c.id}" data-bulk-id="${c.id}" onchange="bulkToggle(${c.id},this.checked)" ${!ok?'disabled':''} ${BULK_SELECTED.has(c.id)?'checked':''}><span style="flex:1;min-width:150px"><span class="bulk-name">${esc(c.name)}</span><span class="bulk-role">${esc(c.role||'Görev belirtilmemiş')}${st.other?' · '+esc(st.other):''}</span></span><span class="bulk-status ${st.kind==='conflict'?'conflict':st.kind==='assigned'?'assigned':''}">${esc(st.label)}</span></label>`}).join('')||'<p style="padding:20px;color:#718096">Arama ölçütlerine uygun personel bulunamadı.</p>';
 const allAvailable=(D.crew||[]).filter(c=>!c.archived&&bulkEligibility(BULK_PROJECT_ID,c.id).kind==='ok').map(c=>c.id);
 for(const id of BULK_SELECTED)if(!allAvailable.includes(id))BULK_SELECTED.delete(id);
 $('#bulk-count').textContent=BULK_SELECTED.size+' personel seçili';
 $('#bulk-summary').textContent=`Bu görünümde: ${available} uygun · ${conflict} çakışma · ${assigned} zaten atanmış`;
 let submit=$('#bulk-submit');submit.disabled=!BULK_SELECTED.size;submit.textContent=`${BULK_SELECTED.size} personeli ata`;
}
function bulkToggle(id,checked){if(checked&&bulkEligibility(BULK_PROJECT_ID,id).kind==='ok')BULK_SELECTED.add(id);else BULK_SELECTED.delete(id);bulkRenderList()}
function bulkSelectVisible(){bulkVisibleCrew().forEach(c=>{if(bulkEligibility(BULK_PROJECT_ID,c.id).kind==='ok')BULK_SELECTED.add(c.id)});bulkRenderList()}
function bulkClearSelection(){BULK_SELECTED.clear();bulkRenderList()}
async function bulkAssignSubmit(e){
 e.preventDefault();let btn=$('#bulk-submit');if(!BULK_SELECTED.size)return;
 btn.disabled=true;
 try{
  const result=await api('mutate',{op:'assign-bulk',project_id:BULK_PROJECT_ID,crew_ids:[...BULK_SELECTED]});
  $('#dialog').close();await refresh();
  toast(`${result.added} personel atandı${result.already?' · '+result.already+' kişi zaten projede':''}.`);
 }catch(err){toast(err.message);btn.disabled=false;bulkRenderList()}
}
function assignDialog(pid,t){show(t==='crew'?'Ekip üyesi ata':'Araç ata',`<form id="assignform">${input(['resource_id','Kaynak','ref',t],'')}<footer><button class="primary">Ata</button></footer></form>`);$('#assignform').onsubmit=async e=>{e.preventDefault();if(await run({op:'assign',project_id:pid,type:t,...Object.fromEntries(new FormData(e.target))}))$('#dialog').close()}}

function invoiceDialog(pid){show('Fatura oluştur',`<form id="invform"><label>KDV oranı (%)<input name="tax" type="number" min="0" max="100" step="0.01" value="20" required></label><footer><button class="primary">Oluştur</button></footer></form>`);$('#invform').onsubmit=async e=>{e.preventDefault();if(await run({op:'invoice',project_id:pid,tax:new FormData(e.target).get('tax')}))$('#dialog').close()}}
function warehouse(){let ps=D.projects.filter(p=>!p.archived&&['Onaylandı','Sahada'].includes(p.status));return heading('Depo',btn('Projeleri aç',"go('projects')"),'Hazırlık · çıkış · kısmi iade')+toolbar()+`<div class="split">${filtered(ps).map(p=>{let ls=D.project_lines.filter(l=>l.project_id===p.id),sum=k=>ls.reduce((a,l)=>a+l[k],0);return `<div class="card"><div class="head"><h2>${esc(p.name)}</h2>${tag(p.status)}</div><p>${esc(label('contacts',p.customer_id))}</p><p class="muted">${dt(p.start)} — ${dt(p.end)}</p><div class="bar"><i style="width:${sum('qty')?sum('packed')/sum('qty')*100:0}%;background:#1473e6"></i></div><p>Plan: <b>${sum('qty')}</b> · Hazır: <b>${sum('packed')}</b> · Çıkış: <b>${sum('dispatched')}</b> · İade: <b>${sum('returned')}</b></p>${btn('Paketleme listesini aç',`openProject(${p.id});tab='warehouse';renderBody()`,true)}</div>`}).join('')}</div>${!ps.length?`<div class="panel">${empty('Depoda işleme hazır proje yok.')}</div>`:''}`}

/* İçerik orijinal V5 fonksiyonlarından gelir; Dashboard kullanıcı tarafından düzenlenir. */
function dashPref(id){MASTER_DASH_PREFS=MASTER_DASH_PREFS.includes(id)?MASTER_DASH_PREFS.filter(x=>x!==id):[...MASTER_DASH_PREFS,id];localStorage.setItem('sekiz-dashboard-layout',JSON.stringify(MASTER_DASH_PREFS));renderBody()}
function dashMove(id,direction){let i=MASTER_DASH_PREFS.indexOf(id),j=i+direction;if(j<0||j>=MASTER_DASH_PREFS.length)return;[MASTER_DASH_PREFS[i],MASTER_DASH_PREFS[j]]=[MASTER_DASH_PREFS[j],MASTER_DASH_PREFS[i]];localStorage.setItem('sekiz-dashboard-layout',JSON.stringify(MASTER_DASH_PREFS));renderBody()}
function dashboard(){let ps=D.projects.filter(p=>!p.archived),active=ps.filter(p=>!['Tamamlandı','İptal'].includes(p.status)),totalDue=D.invoices.filter(i=>i.status!=='Ödendi').reduce((a,i)=>a+Number(i.total||0),0);let defs=[['active','Aktif proje',active.length,'projects'],['equipment','Ekipman çeşidi',D.equipment.filter(x=>!x.archived).length,'equipment'],['crew','Personel',D.crew.filter(x=>!x.archived).length,'crew'],['vehicles','Araç filosu',D.vehicles.filter(x=>!x.archived).length,'vehicles'],['finance','Açık faturalar',D.invoices.filter(x=>x.status!=='Ödendi').length,'invoices'],['projects','Toplam proje',ps.length,'projects']];let editor=MASTER_DASH_EDIT?`<div class="dash-edit"><b>Dashboard kartları — göster, gizle ve sırala</b><div class="dashboard-toggles">${defs.map(x=>`<button class="${MASTER_DASH_PREFS.includes(x[0])?'selected-filter':''}" onclick="dashPref('${x[0]}')">${MASTER_DASH_PREFS.includes(x[0])?'✓':'＋'} ${x[1]}</button>`).join('')}</div><div>${MASTER_DASH_PREFS.map(id=>{let x=defs.find(v=>v[0]===id);return `<div style="display:inline-flex;gap:3px;margin:4px;border:1px solid #cad9ed;padding:5px;border-radius:9px;align-items:center">${x?.[1]||id}<button onclick="dashMove('${id}',-1)">←</button><button onclick="dashMove('${id}',1)">→</button></div>`}).join('')}</div></div>`:'';return heading('Gösterge Paneli',B(MASTER_DASH_EDIT?'Düzenlemeyi bitir':'Paneli düzenle','settings','MASTER_DASH_EDIT=!MASTER_DASH_EDIT;renderBody()')+B('Yeni proje','plus',"edit('projects')",'primary'),'Operasyon merkezi · Özelleştirilebilir görünüm')+editor+`<div class="cards">${MASTER_DASH_PREFS.map(id=>{let x=defs.find(a=>a[0]===id);return x?`<div class="card"><span class="muted">${x[1]}</span><b class="number">${x[2]}</b><button class="link" onclick="go('${x[3]}')">Aç →</button></div>`:''}).join('')}</div><div class="split"><section class="card"><h2>Proje durumları</h2>${['Taslak','Onaylandı','Sahada','Tamamlandı'].map(st=>`<p>${st} <strong style="float:right">${ps.filter(p=>p.status===st).length}</strong></p>`).join('')}</section><section class="card"><h2>Finans özeti</h2><p class="muted">Ödenmemiş tutar</p><h2>${money(totalDue)}</h2>${B('Faturaları aç','money',"go('invoices')")}</section></div><section class="card" style="margin-top:15px"><h2>Yaklaşan projeler</h2>${table(['Proje','Başlangıç','Bitiş','Durum'],active.sort((a,b)=>a.start.localeCompare(b.start)).slice(0,7).map(p=>`<tr><td><button class="link" onclick="openProject(${p.id})">${esc(p.name)}</button></td><td>${dt(p.start)}</td><td>${dt(p.end)}</td><td>${tag(p.status)}</td></tr>`))}</section>`}
